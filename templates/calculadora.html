<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calculadora.css') }}">
</head>

<body>

    <div class="calculadora">

        <h1>Calculadora</h1>

        <input type="number" id="numero1" placeholder="Primeiro número">

        <input type="number" id="numero2" placeholder="Segundo número">

        <br>

        <button onclick="somar()">+</button>
        <button onclick="subtrair()">−</button>
        <button onclick="multiplicar()">×</button>
        <button onclick="dividir()">÷</button>

        <div id="resultado">
            Resultado: 0
        </div>

        <br>

        <a href="/" style="color: white;">Voltar</a>

    </div>

    <script>
        function pegarNumeros() {
            let numero1 = Number(document.getElementById("numero1").value);
            let numero2 = Number(document.getElementById("numero2").value);

            return [numero1, numero2];
        }

        function somar() {
            let [numero1, numero2] = pegarNumeros();
            document.getElementById("resultado").innerHTML =
                "Resultado: " + (numero1 + numero2);
        }

        function subtrair() {
            let [numero1, numero2] = pegarNumeros();
            document.getElementById("resultado").innerHTML =
                "Resultado: " + (numero1 - numero2);
        }

        function multiplicar() {
            let [numero1, numero2] = pegarNumeros();
            document.getElementById("resultado").innerHTML =
                "Resultado: " + (numero1 * numero2);
        }

        function dividir() {
            let [numero1, numero2] = pegarNumeros();

            if (numero2 === 0) {
                document.getElementById("resultado").innerHTML =
                    "Não é possível dividir por zero!";
            } else {
                document.getElementById("resultado").innerHTML =
                    "Resultado: " + (numero1 / numero2);
            }
        }
    </script>

</body>
</html>
