<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='calculadora.css') }}">
</head>

<body>

    <div class="calculadora">
        <h1>Calculadora</h1>
        
        <input type="number" id="numero1" placeholder="Primeiro número">
        <input type="number" id="numero2" placeholder="Segundo número">
        <br>

        <button onclick="calcular('somar')">+</button>
        <button onclick="calcular('subtrair')">−</button>
        <button onclick="calcular('multiplicar')">×</button>
        <button onclick="calcular('dividir')">÷</button>
        <br>
        <br>
        <a href="/">Voltar</a>
    </div>
</body>
</html>
